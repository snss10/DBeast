[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dbeast"
version = "0.1.0"
description = "Expert-level PostgreSQL database analysis MCP. Schema discovery, query execution, health/maintenance/replication/security audits, data quality, partition analysis, and write-impact previews."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["postgresql", "database", "sql", "mcp", "dba", "performance", "security", "partitions", "vacuum", "replication"]
dependencies = [
    "mcp>=1.0.0",
    "asyncpg>=0.29.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "boto3>=1.34.0",
    "sqlglot>=26.0.0",
    "cachetools>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pre-commit>=3.5.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "bandit>=1.7.0",
    "safety>=2.0.0",
]

[project.scripts]
dbeast = "server:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "README.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT"]
ignore = ["E501", "B008", "A002"]

[tool.ruff.lint.per-file-ignores]
"src/server.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["models.inputs", "src.models.inputs"]
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
module = ["tools.*", "src.tools.*"]
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "call-overload",
    "dict-item",
    "index",
    "misc",
    "operator",
    "union-attr",
    "var-annotated",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
